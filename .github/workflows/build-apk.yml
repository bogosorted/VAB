name: Build VAB APK & Run STDD Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build-slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone whisper.cpp and llama.cpp
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git third_party/whisper.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run STDD JVM unit tests
        run: ./gradlew testDevSlimDebugUnitTest --no-daemon

      - name: Build devSlim Debug APK
        run: ./gradlew assembleDevSlimDebug --no-daemon

      - name: Upload devSlim APK
        uses: actions/upload-artifact@v4
        with:
          name: vab-devSlim-debug-apk
          path: app/build/outputs/apk/devSlim/debug/*.apk
